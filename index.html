        * {

            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        /* 计时器样式 */
        .counter {
            background: #fff0f3;
            border: 2px dashed #ff758c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .counter h3 {
            color: #ff5c8a;
            margin-bottom: 10px;
        }
        #time-elapsed {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        /* 照片墙样式 */
        .photo-section {
            margin-bottom: 30px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.15);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            background: #fff0f3;
        }
        .photo-desc span {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #ff5c8a;
            font-weight: bold;
            display: inline-block;
            transition: color 0.2s;
        }
        .photo-card:hover .photo-desc span {
            color: #ff477e;
            text-decoration: underline;
        }

        /* 底部孩子们样式 */
        footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #777;
        }
        .kids-title {
            font-weight: bold;
            color: #ff5c8a;
            margin-bottom: 12px;
        }
        .kids-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .kid-tag {
            background: #fff0f3;
            color: #ff477e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #ff758c;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .kid-tag:hover {
            background: #ff477e;
            color: white;
            transform: translateY(-2px);
        }

        /* 通用弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.82);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 16px;
        }
        .modal-content {
            background: #fffafa;
            padding: 28px 22px;
            border-radius: 20px;
            max-width: 620px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            position: relative;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        .modal-content h2 {
            color: #ff477e;
            margin-bottom: 16px;
            font-size: 1.5rem;
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.8rem;
            color: #aaa;
            cursor: pointer;
            line-height: 1;
            z-index: 10;
        }
        .close-btn:hover {
            color: #ff477e;
        }

           萌宠身份证卡片样式 (ID Card)

            flex-direction: column;
            gap: 16px;
            margin-bottom: 22px;
        }
        .id-card {
            background: linear-gradient(135deg, #fff0f3 0%, #ffffff 65%, #fff5f7 100%);
            border: 2px solid #ffb3c6;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(255, 92, 138, 0.12);
            position: relative;
            text-align: left;
        }
        .id-card::after {
            content: "🐾";
            position: absolute;
            right: 12px;
            bottom: 6px;
            font-size: 3.6rem;
            opacity: 0.08;
            pointer-events: none;
            transform: rotate(-15deg);
        }
        .id-card-header {
            background: linear-gradient(90deg, #ff5c8a, #ff8da1);
            color: white;
            padding: 7px 16px;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 0.8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .id-card-body {
            display: flex;
            padding: 18px 16px 14px;
            gap: 18px;
            align-items: center;
        }
        .id-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .id-avatar-box {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid #ff758c;
            background: #ffe5ec;
            box-shadow: 0 4px 10px rgba(255, 71, 126, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.6rem;
            overflow: hidden;
            position: relative;
        }
        .id-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            transition: transform 0.25s;
        }
        .id-avatar-box img:hover {
            transform: scale(1.08);
        }
        .id-avatar-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #fff;
            border: 2px solid #ffb3c6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.95rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .id-info {
            flex: 1;
            min-width: 0;
        }
        .id-name-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .id-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #d6336c;
        }
        .id-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .id-tag {
            background: #ffe3ec;
            color: #ff477e;
            border: 1px solid #ffc2d1;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 600;
        }
        .id-fields {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px 12px;
            background: rgba(255, 255, 255, 0.75);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px dashed #ffc2d1;
        }
        .id-field {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #444;
        }
        .id-field-label {
            color: #ff5c8a;
            font-weight: 600;
            margin-right: 4px;
        }

            padding: 8px 12px;
            background: #fff0f5;
            border-left: 3px solid #ff5c8a;
            border-radius: 6px;
            font-size: 0.84rem;

            color: #ff5c8a;
            font-weight: bold;
            margin: 6px 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

        .gallery-divider::after {
            content: "";
            height: 1px;
            width: 45px;
            background: #ffc2d1;
        }

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 180px));
            justify-content: center;
            gap: 12px;

            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;

            top: 0;

            flex-direction: column;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
        }

            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;

                            { label: "🎂 生日", value: "待录入" },
                            { label: "❤️ 爱好", value: "待录入" },
                            { label: "✨ 特点", value: "待录入" },
                            { label: "📫 邮箱", value: "无" }
                        ],
                        bio: "💡 爸爸自己领养的"
                    }
                ],
                images: ["xiaoduo1.jpg"]
            },
            // 👇 新增 3：熊小星（直接修改下面的文字和图片名即可）
            xiongxiaoxing: {
                title: "熊小星的id card ⭐",
                cards: [
                    {
                        idNo: "DJ-010",
                        name: "熊小星",
                        emoji: "⭐",
                        avatar: "xiongxiaoxing1.jpg",
                        tags: ["🐻 小熊族", "⭐ 闪亮"],
                        fields: [
                            { label: "🎂 生日", value: "待录入" },
                            { label: "❤️ 爱好", value: "待录入" },
                            { label: "✨ 特点", value: "待录入" },
                            { label: "📫 邮箱", value: "无" }
                        ],
                        bio: "💡 自己乖乖的待在一边"
                    }
                ],
                images: ["xiongxiaoxing1.jpg"]
            }
        };

        // 计时器逻辑
        const startDate = new Date("2026-04-29T00:00:00");
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById("time-elapsed").textContent =
                `${days} 天 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 智能图片后缀容错：如果 .jpg 加载失败，自动尝试 .png / .jpeg / .JPG / .PNG
        function bindSmartImage(imgEl, originalSrc, isAvatar = false) {
            const baseName = originalSrc.replace(/\.[^/.]+$/, "");
            const fallbackExts = [".png", ".jpg", ".jpeg", ".PNG", ".JPG", ".webp"];
            let tryIndex = 0;

            imgEl.src = originalSrc;
            imgEl.onclick = function() {
                openLightbox(imgEl.src);
            };
            imgEl.onerror = function() {
                while (tryIndex < fallbackExts.length) {
                    const nextCandidate = baseName + fallbackExts[tryIndex];
                    tryIndex++;
                    if (nextCandidate !== originalSrc) {
                        imgEl.src = nextCandidate;
                        return;
                    }
                }
                // 所有后缀都找不到时，优雅降级
                if (isAvatar) {
                    imgEl.style.display = "none";
                } else {
                    imgEl.onclick = null;
                    imgEl.style.cursor = "default";
                    imgEl.alt = "（图片待上传）";
                }
            };
        }

        // 给主页封面的 3 张图也加上智能后缀识别
        document.querySelectorAll(".photo-card img").forEach(img => {
            const rawSrc = img.getAttribute("src");
            bindSmartImage(img, rawSrc, false);
            img.onclick = null; // 保持点击由外层 photo-card 触发相册
        });

        // 打开旅行相册
        function openAlbum(category) {
            const album = albumsData[category];
            if (album) renderModal(album.title, [], album.images);
        }

        // 打开玩偶身份证弹窗
        function openKid(kidKey) {
            const kid = kidsData[kidKey];
            if (kid) renderModal(kid.title, kid.cards, kid.images);
        }

        // 渲染弹窗
        function renderModal(title, cards, images) {
            const modal = document.getElementById("modal");
            const titleEl = document.getElementById("modal-title");
            const cardsContainer = document.getElementById("modal-cards-container");
            const dividerEl = document.getElementById("gallery-divider");
            const gridEl = document.getElementById("modal-images");

            titleEl.textContent = title;
            cardsContainer.innerHTML = "";

            if (cards && cards.length > 0) {
                cards.forEach(card => {
                    const tagsHtml = (card.tags || [])
                        .map(tag => `<span class="id-tag">${tag}</span>`)
                        .join("");

                    const fieldsHtml = (card.fields || [])
                        .map(f => `<div class="id-field"><span class="id-field-label">${f.label}：</span>${f.value}</div>`)
                        .join("");

                    const cardEl = document.createElement("div");
                    cardEl.className = "id-card";
                    cardEl.innerHTML = `
                        <div class="id-card-header">
                            <span>🪪 DAVE & JANE FAMILY ID CARD</span>
                            <span>NO. ${card.idNo}</span>
                        </div>
                        <div class="id-card-body">
                            <div class="id-avatar-wrap">
                                <div class="id-avatar-box">
                                    <span>${card.emoji || "🧸"}</span>
                                    <img class="card-avatar-img" alt="${card.name}">
                                </div>
                                <div class="id-avatar-badge">${card.emoji || "🧸"}</div>
                            </div>
                            <div class="id-info">
                                <div class="id-name-row">
                                    <span class="id-name">${card.name}</span>
                                </div>
                                <div class="id-tags">${tagsHtml}</div>
                                <div class="id-fields">${fieldsHtml}</div>
                            </div>
                        </div>
                        ${card.bio ? `<div class="id-bio">${card.bio}</div>` : ""}
                    `;
                    const avatarImg = cardEl.querySelector(".card-avatar-img");
                    bindSmartImage(avatarImg, card.avatar, true);
                    cardsContainer.appendChild(cardEl);
                });
                cardsContainer.style.display = "flex";
                dividerEl.style.display = "flex";
            } else {
                cardsContainer.style.display = "none";
                dividerEl.style.display = "none";
            }

            gridEl.innerHTML = "";
            images.forEach(imgSrc => {
                const img = document.createElement("img");
                img.alt = title;
                bindSmartImage(img, imgSrc, false);
                gridEl.appendChild(img);
            });

            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
            document.body.style.overflow = "";
        }

        function openLightbox(src) {
            const lightbox = document.getElementById("lightbox-modal");
            const lightboxImg = document.getElementById("lightbox-img");
            lightboxImg.src = src;
            lightbox.style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox-modal").style.display = "none";
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                const lightbox = document.getElementById("lightbox-modal");
                if (lightbox.style.display === "flex") {
                    closeLightbox();
                } else {
                    closeModal();
                }
            }
        });
    </script>
</body>
