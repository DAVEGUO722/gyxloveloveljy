<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAVE and JANE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 20px;
            margin-top: 20px;
            text-align: center;
        }
        h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }
        /* 计时器样式 */
        .counter {
            background: #fff0f3;
            border: 2px dashed #ff758c;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }
        .counter h3 {
            color: #ff5c8a;
            margin-bottom: 10px;
        }
        #time-elapsed {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        /* 照片墙样式 */
        .photo-section {
            margin-bottom: 30px;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .photo-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.15);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            background: #fff0f3;
        }
        .photo-desc span {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #ff5c8a;
            font-weight: bold;
            display: inline-block;
            transition: color 0.2s;
        }
        .photo-card:hover .photo-desc span {
            color: #ff477e;
            text-decoration: underline;
        }

        /* 底部孩子们样式 */
        footer {
            margin-top: 30px;
            font-size: 0.95rem;
            color: #777;
        }
        .kids-title {
            font-weight: bold;
            color: #ff5c8a;
            margin-bottom: 12px;
        }
        .kids-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .kid-tag {
            background: #fff0f3;
            color: #ff477e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid #ff758c;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .kid-tag:hover {
            background: #ff477e;
            color: white;
            transform: translateY(-2px);
        }

        /* 通用弹窗样式（相册 & 玩偶介绍） */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 30px 24px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            text-align: center;
        }
        .modal-content h2 {
            color: #ff477e;
            margin-bottom: 12px;
        }
        .modal-desc {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.7;
            background: #fff8f9;
            border: 1px solid #ffe0e6;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: left;
            white-space: pre-line;
        }
        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 220px));
            justify-content: center;
            gap: 12px;
        }
        .modal-grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            background: #fff0f3;
        }
        .modal-grid img:hover {
            transform: scale(1.03);
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 1.8rem;
            color: #aaa;
            cursor: pointer;
            line-height: 1;
        }
        .close-btn:hover {
            color: #333;
        }

        /* 大图预览弹窗 */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 1100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            object-fit: contain;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dave ❤️ Jane<br>郭亚轩 ❤️ 李佳仪</h1>
        <p class="subtitle">老婆我现在肚子好饿你还在那上课</p>

        <!-- 计时器 -->
        <div class="counter">
            <h3>'bound to love' recorder : 轩轩 loves 美美 more with each extra second</h3>
            <div id="time-elapsed">计算中...</div>
        </div>

        <!-- 照片展示区（封面） -->
        <div class="photo-section">
            <h2 style="color: #ff5c8a; font-size: 1.5rem; margin-bottom: 15px;">memory</h2>
            <div class="photo-grid">
                <!-- 照片 1 组 -->
                <div class="photo-card" onclick="openAlbum('first')">
                    <img src="photo1.jpg" alt="first trip">
                    <div class="photo-desc">
                        <span>first trip ✈️ izu</span>
                    </div>
                </div>
                <!-- 照片 2 组 -->
                <div class="photo-card" onclick="openAlbum('chocolate')">
                    <img src="photo2.jpg" alt="chocolate factory">
                    <div class="photo-desc">
                        <span>chocolate factory 🍰 sapporo</span>
                    </div>
                </div>
                <!-- 照片 3 组 -->
                <div class="photo-card" onclick="openAlbum('original')">
                    <img src="photo3.jpg" alt="original day">
                    <div class="photo-desc">
                        <span>original day ✨ tokyo</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部孩子们（玩偶们） -->
        <footer>
            <div class="kids-title">🧸 孩子们</div>
            <div class="kids-links">
                <span class="kid-tag" onclick="openKid('pangdudu')">胖嘟嘟</span>
                <span class="kid-tag" onclick="openKid('kuer')">库儿</span>
                <span class="kid-tag" onclick="openKid('bode')">博德</span>
                <span class="kid-tag" onclick="openKid('xiaohuoren')">小火人</span>
                <span class="kid-tag" onclick="openKid('suki')">suki</span>
                <span class="kid-tag" onclick="openKid('jiyi')">吉伊</span>
                <span class="kid-tag" onclick="openKid('kapibala')">卡皮巴拉</span>
            </div>
        </footer>
    </div>

    <!-- 通用相册/玩偶弹窗 -->
    <div id="modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title">标题</h2>
            <div id="modal-desc" class="modal-desc" style="display: none;"></div>
            <div class="modal-grid" id="modal-images"></div>
        </div>
    </div>

    <!-- 大图预览弹窗 -->
    <div id="lightbox-modal" onclick="closeLightbox()">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="大图" onclick="event.stopPropagation()">
    </div>

    <script>
        // 旅行相册数据配置
        const albumsData = {
            first: {
                title: "first trip ✈️ izu 相册",
                images: ["photo1.jpg"]
            },
            chocolate: {
                title: "chocolate factory 🍰 sapporo 相册",
                images: [
                    "photo2.jpg", "photo2_extra1.jpg", "photo2_extra2.jpg",
                    "photo2_extra3.jpg", "photo2_extra4.jpg", "photo2_extra5.jpg",
                    "photo2_extra6.jpg", "photo2_extra7.jpg", "photo2_extra8.jpg", "photo2_extra9.jpg"
                ]
            },
            original: {
                title: "original day ✨ tokyo 相册",
                images: ["photo3.jpg", "photo3_extra1.jpg", "photo3_extra2.jpg"]
            }
        };

        // 孩子们（玩偶）数据配置
        const kidsData = {
            pangdudu: {
                name: "胖嘟嘟 🐱",
                desc: "💡 简介：家里最稳重（也最胖）的崽\n🐾 种族：猫🐱（幼年）｜性别：公｜身高：5cm\n🎂 生日：2026.9.16\n❤️ 爱好：吃｜特点：很胖｜邮箱：无",
                images: ["pangdudu1.jpg", "pangdudu2.jpg"]
            },
            kuer: {
                name: "库儿 🧸",
                desc: "🎂 生日：2026.4.28｜性别：公\n❤️ 爱好：看游戏直播｜特点：很萌",
                images: ["kuer1.jpg", "kuer2.jpg", "kuer3.jpg"]
            },
            bode: {
                name: "博德兄弟 🐧🐧",
                desc: "【博德 1】\n🐾 种族：🐦（幼年）｜性别：雄｜生日：2026.6.28\n❤️ 爱好：拍表情包｜特点：歪嘴🫤｜邮箱：无\n\n【博德 2】\n🐾 种族：🐦（幼年）｜性别：雄｜生日：2026.9.16\n❤️ 爱好：学习｜特点：可以移动尾巴｜邮箱：无",
                images: ["bode1.jpg", "bode2.jpg"]
            },
            xiaohuoren: {
                name: "小火人 🔥",
                desc: "",
                images: ["xiaohuoren1.jpg", "xiaohuoren2.jpg"]
            },
            suki: {
                name: "suki 😻",
                desc: "",
                images: ["suki1.jpg"]
            },
            jiyi: {
                name: "吉伊 ✨",
                desc: "",
                images: ["jiyi1.jpg"]
            },
            kapibala: {
                name: "卡皮巴拉 🍊",
                desc: "",
                images: ["kapibala1.jpg"]
            }
        };

        // 计时器逻辑
        const startDate = new Date("2026-04-29T00:00:00");
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            document.getElementById("time-elapsed").textContent =
                `${days} 天 ${hours} 小时 ${minutes} 分钟 ${seconds} 秒`;
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // 打开旅行相册
        function openAlbum(category) {
            const album = albumsData[category];
            if (album) showModal(album.title, "", album.images);
        }

        // 打开玩偶主页
        function openKid(kidKey) {
            const kid = kidsData[kidKey];
            if (kid) showModal(kid.name, kid.desc, kid.images);
        }

        // 统一弹窗展示函数
        function showModal(title, description, images) {
            const modal = document.getElementById("modal");
            const titleEl = document.getElementById("modal-title");
            const descEl = document.getElementById("modal-desc");
            const gridEl = document.getElementById("modal-images");

            titleEl.textContent = title;

            if (description && description.trim() !== "") {
                descEl.textContent = description;
                descEl.style.display = "block";
            } else {
                descEl.style.display = "none";
            }

            gridEl.innerHTML = "";
            images.forEach(imgSrc => {
                const img = document.createElement("img");
                img.src = imgSrc;
                img.alt = title;
                img.onclick = function() {
                    openLightbox(imgSrc);
                };
                img.onerror = function() {
                    this.onclick = null;
                    this.style.cursor = "default";
                    this.alt = "（图片待上传）";
                };
                gridEl.appendChild(img);
            });

            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById("modal").style.display = "none";
            document.body.style.overflow = "";
        }

        // 打开大图预览
        function openLightbox(src) {
            const lightbox = document.getElementById("lightbox-modal");
            const lightboxImg = document.getElementById("lightbox-img");
            lightboxImg.src = src;
            lightbox.style.display = "flex";
        }

        // 关闭大图预览
        function closeLightbox() {
            document.getElementById("lightbox-modal").style.display = "none";
        }

        // 支持按 Esc 键关闭弹窗
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") {
                const lightbox = document.getElementById("lightbox-modal");
                if (lightbox.style.display === "flex") {
                    closeLightbox();
                } else {
                    closeModal();
                }
            }
        });
    </script>
</body>
</html>
